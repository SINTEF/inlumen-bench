# Additions for a shared Linux server, enabled from .env:
#   COMPOSE_FILE=compose.yaml:compose.linux.yaml
#   BENCH_UID=1008  BENCH_GID=1008   (id -u, id -g)
#
# - The containers use the host's network, so a model server that listens only on
#   127.0.0.1 (a system Ollama, for instance) is reachable as http://127.0.0.1:11434/v1.
#   The dashboard then binds to 127.0.0.1 itself; open it through an SSH tunnel.
# - They run as root, because ServiceCraft's evaluator removes files that its sandbox
#   containers wrote as uid 65532. After every command or dashboard job, bench gives
#   the corpus folders, runs and config back to BENCH_UID:BENCH_GID.
# - A Kubernetes kubelet on the same Docker engine deletes unused images when the
#   disk is over 85% full. Bench keeps one idle container per evaluator image
#   (inlumen-bench-keep-*) so they count as in use, and rebuilds missing ones.
x-linux: &linux
  network_mode: host
  extra_hosts: !reset []
  environment:
    INLUMEN_BENCH_LOCAL_HOST: 127.0.0.1
    INLUMEN_BENCH_KEEP_IMAGES: "1"
    INLUMEN_BENCH_OWNER: "${BENCH_UID:?set BENCH_UID in .env}:${BENCH_GID:?set BENCH_GID in .env}"

services:
  dashboard:
    <<: *linux
    ports: !reset []
    command: ["serve", "--host", "127.0.0.1", "--port", "${BENCH_PORT:-8000}"]
  bench:
    <<: *linux
