[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "inlumen-bench"
version = "0.3.6"
description = "Generation driver and dashboard for benchmarking pipeline design and code generation on the ServiceCraft corpus."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "platformdirs>=4,<5",
    "rich>=13,<15",
    "typer>=0.12,<1",
    "streamlit>=1.50,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
# What ServiceCraft's evaluator needs; the Docker image runs it with its own Python.
evaluator = ["pydantic>=2,<3", "jsonschema==4.24.0"]
# The `inlumen` method runs inLUMEN's own agents, published on PyPI. Pinned exactly:
# experiments record this version, and it is a pre-release.
inlumen = ["inlumen-agents[design,codegen]==1.0.0b6.dev3"]

[project.scripts]
bench = "inlumen_bench.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/inlumen_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
